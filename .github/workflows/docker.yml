name: Test and Publish Docker Image

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        directory: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Install IPA test dependency
        if: matrix.directory == 'backend'
        run: sudo apt-get update && sudo apt-get install -y zip
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ${{ matrix.directory }}/package-lock.json
      - run: npm ci
        working-directory: ${{ matrix.directory }}
      - run: npm test
        working-directory: ${{ matrix.directory }}
      - run: npm run build
        working-directory: ${{ matrix.directory }}

  build:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Set lowercase image name
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=pr89,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha,prefix=sha-
      - name: Build smoke-test image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: assppweb-smoke:test
          build-args: BUILD_COMMIT=${{ github.sha }}
          cache-from: type=gha
      - name: Verify container and bundled SAP assets
        run: |
          docker run -d --name assppweb-smoke -p 127.0.0.1:8080:8080 assppweb-smoke:test
          trap 'docker logs assppweb-smoke; docker rm -f assppweb-smoke' EXIT
          curl --fail --retry 15 --retry-connrefused --retry-delay 2 http://127.0.0.1:8080/api/settings
          curl --fail -X POST http://127.0.0.1:8080/api/sap-assets/prepare
          for asset in CommerceKit CommerceCore CoreFP CoreFP.icxs; do
            curl --fail --max-time 30 --compressed "http://127.0.0.1:8080/api/sap-assets/$asset" -o /dev/null
          done
          curl --fail http://127.0.0.1:8080/api/sap-assets/status
      - name: Build and publish amd64 and arm64
        id: publish
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: BUILD_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Record published digest
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: echo "$IMAGE@$DIGEST" >> "$GITHUB_STEP_SUMMARY"
